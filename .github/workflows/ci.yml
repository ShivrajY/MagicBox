name: MagicBox CI

on:
  push:
  pull_request:

concurrency:
  group: magicbox-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore --locked-mode
      - run: dotnet build MagicBox.sln --no-restore --configuration Release
      - run: dotnet test MagicBox.sln --no-build --configuration Release
      - run: dotnet pack src/MagicBox.Core/MagicBox.Core.csproj --no-build --configuration Release --output ./artifacts
      - run: dotnet pack src/MagicBox.Cli/MagicBox.Cli.csproj --no-build --configuration Release --output ./artifacts

  browser:
    name: Browser smoke (Chromium)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore --locked-mode
      - run: dotnet build src/MagicBox.Cli/MagicBox.Cli.csproj --no-restore --configuration Release
      - shell: pwsh
        run: ./src/MagicBox.Cli/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - run: dotnet run --project src/MagicBox.Cli --no-build --configuration Release -- doctor --browser
