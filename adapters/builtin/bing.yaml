schemaVersion: 1
id: bing
kind: search
inputs:
  query:
    required: true
    type: string
request:
  method: GET
  url: https://www.bing.com/search
  query:
    q: ${input.query}
  headers:
    User-Agent: MagicBox/1.0
  timeoutMs: 30000
render:
  mode: http
  fallbackOn: []
response:
  type: html
extract:
  items:
    css: h2 > a
  fields:
    title:
      source: text
      transforms:
        - kind: trim
        - kind: htmldecode
    url:
      source: attribute
      attribute: href
      transforms:
        - kind: urlresolve
          argument: source
        - kind: requireAbsoluteUri
pagination:
  strategy: none
  maxPages: 1
policy:
  requiredFields: [title, url]
  robots: report
